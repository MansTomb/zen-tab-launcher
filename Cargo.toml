[package]
name = "zen-tab-launcher"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "zen-tab"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }
